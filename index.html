
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลอยกระทงให้คนที่รัก 🪷</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif;}
        body{
            background: linear-gradient(180deg, #050d33 0%, #101a52 40%, #1a2a70 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        h1{
            position: absolute;
            top: 30px; left: 50%; transform: translateX(-50%);
            color: white; font-size: 1.5rem; text-align: center;
            z-index: 10;
        }
        .sub{
            position: absolute;
            top: 75px; left: 50%; transform: translateX(-50%);
            color: #aab8f0; font-size: 1rem; z-index: 10;
        }
        .lotus-container{
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 30px; z-index: 10;
        }
        .lotus-option{
            font-size: 3.5rem; cursor: pointer;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255,200,100,0.4));
        }
        .lotus-option:hover{ transform: scale(1.2); }
        .water{
            position: absolute; bottom: 0; width: 100%; height: 180px;
            background: linear-gradient(180deg, rgba(30,60,130,0.6) 0%, rgba(15,40,90,0.95) 100%);
            border-top: 2px solid rgba(100,150,255,0.2);
        }
        .floating-lotus{
            position: absolute; font-size: 3rem;
            animation: floatUp 6s ease-in forwards;
            z-index: 5;
        }
        @keyframes floatUp{
            0%{ opacity:1; transform: translateY(0) rotate(0deg); }
            30%{ opacity:1; transform: translateY(-80px) rotate(3deg); }
            100%{ opacity:0; transform: translateY(-350px) rotate(-5deg); }
        }
        .message-box{
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            padding: 35px 25px; border-radius: 20px; color: white;
            text-align: center; line-height: 2; max-width: 360px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 30px rgba(100,150,255,0.15);
            opacity:0; transition: opacity 0.8s ease; z-index: 20;
        }
        .message-box.show{ opacity:1; }
        .close-btn{
            margin-top: 25px; padding: 8px 25px; background: rgba(255,255,255,0.15);
            border: none; border-radius: 20px; color: white; cursor: pointer;
            font-size: 0.95rem; transition: background 0.3s;
        }
        .close-btn:hover{ background: rgba(255,255,255,0.25); }
        .star{
            position: absolute; width: 2px; height: 2px;
            background: white; border-radius: 50%;
            animation: twinkle 2.5s infinite;
        }
        @keyframes twinkle{
            0%,100%{ opacity: 0.15; }
            50%{ opacity: 1; }
        }
        .hidden{ display: none !important; }
    </style>
</head>
<body>
    <h1>เลือกกระทงของเธอ 🪷</h1>
    <p class="sub">แตะเพื่อลอยกระทง</p>

    <div class="lotus-container" id="lotusPicker">
        <div class="lotus-option" onclick="sendWish('ขอให้เธออยู่กับเค้าไปนาน\nอยู่กับคนๆนี้ไปนาน\nขอให้เราผ่านเรื่องเลวร้ายไปด้วยดี\nคิวรักเอม่านะ รักมากๆ\nถึงจะทำให้อ้วนโกดเค้าบ่อยก็เถอะ\nแต่อยากให้อยู่ด้วยกันไปนานๆ ❤️')">🪷</div>
        <div class="lotus-option" onclick="sendWish('ขอให้เราเข้าใจกันมากขึ้น\nไม่ว่าจะเจออะไร ขอให้เราจับมือกันไว้\nทุกวันข้างเธอ คือวันที่ดีที่สุด\nรักเธอเสมอนะ ❤️')">🌸</div>
        <div class="lotus-option" onclick="sendWish('ลอยทุกข์ ลอยกังวล ให้ไปกับสายน้ำ\nเหลือไว้แต่ความสุขและรอยยิ้ม\nให้กับคนที่เค้ารักที่สุดของเค้า\nรักเธอมากนะ เอม่า 🤍')">✨</div>
    </div>

    <div class="water"></div>

    <div class="message-box hidden" id="messageBox">
        <p id="wishText"></p>
        <button class="close-btn" onclick="closeMessage()">ปิด</button>
    </div>

    <script>
        // สร้างดาว
        for(let i=0; i<80; i++){
            const s=document.createElement('div');
            s.className='star';
            s.style.left=Math.random()*100+'%';
            s.style.top=Math.random()*65+'%';
            s.style.animationDelay=Math.random()*2.5+'s';
            document.body.appendChild(s);
        }

        function sendWish(text){
            // ซ่อนตัวเลือกกระทง
            document.getElementById('lotusPicker').classList.add('hidden');
            
            // สร้างกระทงลอย
            const lotus=event.target.cloneNode(true);
            lotus.classList.remove('lotus-option');
            lotus.classList.add('floating-lotus');
            lotus.style.left='50%';
            lotus.style.bottom='100px';
            lotus.style.transform='translateX(-50%)';
            document.body.appendChild(lotus);

            // แสดงข้อความหลังจากกระทงลอยขึ้นเล็กน้อย
            setTimeout(()=>{
                const box=document.getElementById('messageBox');
                document.getElementById('wishText').innerText=text;
                box.classList.remove('hidden');
                setTimeout(()=>box.classList.add('show'),10);
            },1500);
        }

        function closeMessage(){
            document.getElementById('messageBox').classList.remove('show');
            setTimeout(()=>{
                document.getElementById('messageBox').classList.add('hidden');
                document.getElementById('lotusPicker').classList.remove('hidden');
                // ลบกระทงเก่าออก
                document.querySelectorAll('.floating-lotus').forEach(el=>el.remove());
            },400);
        }
    </script>
</body>
</html>
